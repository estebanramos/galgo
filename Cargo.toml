[package]
name = "galgo"
version = "0.1.0"
edition = "2021"
description = "A security tool for scanning GitHub repositories to detect exposed secrets"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/yourusername/galgo"
keywords = ["security", "github", "secrets", "scanner"]
categories = ["security"]

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.41", features = ["derive"] }
colored = "2"
indicatif = "0.18.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde_json = "1.0.140"
tokio = { version = "1", features = ["full"] }
regex = "1"
futures = "0.3.31"
once_cell = "1.21.3"
serde = { version = "1.0", features = ["derive"] }
urlencoding = "2.1.3"