name: Release

# Push a tag like v0.2.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-13,       target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="galgo-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE patterns.json "$name"/
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/galgo.exe" "$name"/
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/galgo" "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
